name: Privacy Gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: windows-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate public privacy invariants
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\test-privacy-invariants.ps1
